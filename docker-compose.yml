services:
  db:
    image: postgres:17
    container_name: sub_manager_db
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: sub_db
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./subscriptionmanager
      dockerfile: Dockerfile
    container_name: sub_manager_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sub_db
      SPRING_DATASOURCE_USERNAME: dev_user
      SPRING_DATASOURCE_PASSWORD: dev_password
    depends_on:
      - db
